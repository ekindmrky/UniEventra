name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: echo "Tests passed"

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy step
        run: echo "Deploy completed"
